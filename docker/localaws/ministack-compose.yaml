version: "3.8"

services:
  ministack:
    image: ministackorg/ministack:latest
    container_name: ministack

    ports:
      - "4566:4566"

    environment:
      PERSIST_STATE: "1"
      S3_PERSIST: "1"
      RDS_PERSIST: "1"
      LOG_LEVEL: INFO
      LAMBDA_EXECUTOR: docker
      LAMBDA_DOCKER_NETWORK: myproject_default

    volumes:
      - ./data/state:/tmp/ministack-state
      - ./data/s3:/tmp/ministack-data/s3
      - /var/run/docker.sock:/var/run/docker.sock

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  stackport:
    image: davireis/stackport:latest
    container_name: stackport

    ports:
      - "8080:8080"

    environment:
      API_URL: http://ministack:4566

    volumes:
      - ~/.aws:/root/.aws:ro

    depends_on:
      ministack:
        condition: service_healthy